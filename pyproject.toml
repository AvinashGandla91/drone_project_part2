[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-safety-project-ii"
version = "0.1.0"
description = "Experimental movement-stability features and safety-aware drone command validation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.4",
]
vision = [
  "opencv-python>=4.8",
  "mediapipe==0.10.21",
]
ml = [
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "pandas>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
